<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  button { cursor: pointer; }
  #status { font-size: 12px; color: #666; }
  .pending { margin-top: 8px; max-height: 160px; overflow: auto; }
  .pending .item { border: 1px solid #ddd; padding: 6px; margin-bottom: 4px; border-radius: 4px; font-size: 12px; }
  .pending .item .meta { color: #888; }
</style>
</head>
<body>
  <h1>WA Auto-Sender</h1>
  <div class="row">
    <span id="status">Idle</span>
    <button id="openDashboard">Dashboard</button>
  </div>
  <div class="row">
    <button id="toggle">Enable</button>
  </div>
  <div class="pending" id="pending"></div>
<script src="popup.js"></script>
</body>
</html>
