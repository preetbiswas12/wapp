<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WA Auto-Sender Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>WA Auto-Sender Dashboard</h1>
    <div class="status" id="status">Loading…</div>
  </header>

  <nav>
    <button data-tab="review" class="active">Review</button>
    <button data-tab="training">Training Store</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="logs">Sent Log</button>
    <button data-tab="links">Meet Links</button>
  </nav>

  <main>
    <!-- Review -->
    <section id="tab-review" class="tab active">
      <h2>Pending Reviews</h2>
      <div id="pendingList"></div>
    </section>

    <!-- Training -->
    <section id="tab-training" class="tab">
      <h2>Approved Response Templates</h2>
      <div id="categoryList"></div>
    </section>

    <!-- Settings -->
    <section id="tab-settings" class="tab">
      <h2>Settings</h2>
      <form id="settingsForm">
        <label>AI Provider
          <select id="provider">
            <option value="kilo">kilo.ai</option>
            <option value="openai">OpenAI</option>
            <option value="local">Local (Ollama)</option>
          </select>
        </label>
        <label>Mode
          <select id="mode">
            <option value="auto">Auto (auto-send after approval)</option>
            <option value="human">Human decides each reply</option>
          </select>
        </label>
        <label>API Key <input type="password" id="apiKey" /></label>
        <label>Dedupe window (ms)
          <input type="number" id="dedupeWindowMs" />
        </label>
        <label>Min send delay (ms)
          <input type="number" id="minSendDelayMs" />
        </label>
        <button type="submit">Save</button>
      </form>
    </section>

    <!-- Logs -->
    <section id="tab-logs" class="tab">
      <h2>Sent Log</h2>
      <div id="sentList"></div>
    </section>

    <!-- Links -->
    <section id="tab-links" class="tab">
      <h2>Extracted Meet Links</h2>
      <div id="meetList"></div>
    </section>
  </main>

  <div id="toast"></div>
<script src="dashboard.js"></script>
</body>
</html>
